<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер Юри</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Onest:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0A0A0F;
    --surface: #13131A;
    --surface2: #1C1C26;
    --border: #2A2A38;
    --text: #F0EFE8;
    --muted: #6B6A7A;
    --accent: #C8F542;
    --accent2: #42F5C8;
    --red: #F55442;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Onest', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px; }

  .header { padding: 48px 20px 20px; }
  .header-tag { font-family: 'Unbounded', sans-serif; font-size: 0.6rem; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
  .header h1 { font-family: 'Unbounded', sans-serif; font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 700; letter-spacing: -0.02em; }
  .header h1 span { color: var(--accent); }

  .sync-bar { text-align: center; font-size: 0.7rem; padding: 4px 20px 12px; color: var(--muted); }
  .sync-bar.ok { color: var(--accent); }
  .sync-bar.err { color: var(--red); }

  .tabs { display: flex; gap: 4px; padding: 0 20px 20px; }
  .tab { flex: 1; padding: 12px 8px; border: 1px solid var(--border); background: transparent; border-radius: 12px; font-family: 'Unbounded', sans-serif; font-size: 0.6rem; letter-spacing: 0.06em; color: var(--muted); cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .main { padding: 0 20px; }

  /* HABITS */
  .habit-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; position: relative; border-left: 3px solid var(--habit-color, var(--accent)); animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  .habit-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .habit-icon { width: 36px; height: 36px; border-radius: 10px; background: color-mix(in srgb, var(--habit-color, var(--accent)) 20%, transparent); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .habit-name { font-family: 'Unbounded', sans-serif; font-size: 0.78rem; flex: 1; }
  .streak-badge { display: flex; align-items: center; gap: 3px; background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 20px; padding: 3px 8px; font-size: 0.7rem; font-family: 'Unbounded', sans-serif; color: var(--accent); white-space: nowrap; }

  .habit-grid { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; margin-bottom: 10px; }
  .grid-dot { aspect-ratio: 1; border-radius: 3px; background: var(--border); cursor: pointer; transition: all 0.15s; }
  .grid-dot.done { background: var(--habit-color, var(--accent)); }
  .grid-dot.today { outline: 2px solid var(--habit-color, var(--accent)); outline-offset: 1px; }
  .grid-dot:active { transform: scale(0.85); }

  .habit-bottom { display: flex; align-items: center; justify-content: space-between; }
  .habit-stats { font-size: 0.7rem; color: var(--muted); }
  .habit-stats span { color: var(--text); }
  .btn-del { width: 28px; height: 28px; border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .btn-del:hover { color: var(--red); }

  .add-habit-btn { width: 100%; padding: 16px; border: 1.5px dashed var(--border); background: transparent; border-radius: 16px; font-family: 'Onest', sans-serif; font-size: 0.9rem; color: var(--muted); cursor: pointer; transition: all 0.2s; margin-bottom: 20px; }
  .add-habit-btn:hover, .add-habit-btn:active { border-color: var(--accent); color: var(--accent); }

  /* WEIGHT */
  .weight-input-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px 20px; margin-bottom: 16px; }
  .weight-input-label { font-family: 'Unbounded', sans-serif; font-size: 0.65rem; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; margin-bottom: 16px; }
  .today-weight-display { font-family: 'Unbounded', sans-serif; font-size: 3rem; font-weight: 700; color: var(--accent2); line-height: 1; margin-bottom: 4px; }
  .today-weight-display span { font-size: 1.2rem; color: var(--muted); font-weight: 300; }
  .weight-sub { font-size: 0.75rem; color: var(--muted); margin-bottom: 20px; }

  .weight-enter-row { display: flex; gap: 10px; align-items: stretch; }
  .weight-big-input { flex: 1; padding: 16px; background: var(--surface2); border: 2px solid var(--border); border-radius: 14px; font-family: 'Unbounded', sans-serif; font-size: 1.4rem; color: var(--text); text-align: center; outline: none; transition: border-color 0.2s; }
  .weight-big-input:focus { border-color: var(--accent2); }
  .weight-big-input::placeholder { color: var(--muted); font-size: 1rem; }
  .btn-save-weight { flex: 1; padding: 16px; background: var(--accent2); border: none; border-radius: 14px; font-family: 'Unbounded', sans-serif; font-size: 0.7rem; font-weight: 700; color: var(--bg); cursor: pointer; letter-spacing: 0.05em; transition: all 0.2s; }
  .btn-save-weight:hover { filter: brightness(1.1); }
  .btn-save-weight:active { transform: scale(0.97); }

  /* CHART */
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
  .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .chart-title { font-family: 'Unbounded', sans-serif; font-size: 0.65rem; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  .period-btns { display: flex; gap: 4px; }
  .period-btn { padding: 5px 10px; border: 1px solid var(--border); background: transparent; border-radius: 6px; font-family: 'Unbounded', sans-serif; font-size: 0.55rem; color: var(--muted); cursor: pointer; transition: all 0.2s; }
  .period-btn.active { background: var(--surface2); border-color: var(--accent2); color: var(--accent2); }
  canvas { width: 100% !important; display: block; }

  .weight-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .stat-box { background: var(--surface2); border-radius: 12px; padding: 12px; text-align: center; }
  .stat-val { font-family: 'Unbounded', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--accent2); margin-bottom: 4px; }
  .stat-lbl { font-size: 0.65rem; color: var(--muted); }

  .weight-log { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }
  .log-title { font-family: 'Unbounded', sans-serif; font-size: 0.65rem; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; margin-bottom: 14px; }
  .log-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .log-row:last-child { border-bottom: none; }
  .log-date { font-size: 0.8rem; color: var(--muted); }
  .log-date.today-label { color: var(--accent2); font-weight: 500; }
  .log-kg { font-family: 'Unbounded', sans-serif; font-size: 0.9rem; }
  .log-diff { font-size: 0.75rem; font-weight: 500; min-width: 44px; text-align: right; }
  .log-diff.up { color: var(--red); }
  .log-diff.down { color: var(--accent); }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,10,15,0.9); z-index: 100; align-items: flex-end; justify-content: center; backdrop-filter: blur(8px); }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 24px 24px 0 0; padding: 24px 20px 48px; width: 100%; max-width: 600px; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-family: 'Unbounded', sans-serif; font-size: 1rem; font-weight: 600; margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; display: block; font-family: 'Unbounded', sans-serif; }
  .form-input { width: 100%; padding: 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; font-family: 'Onest', sans-serif; font-size: 0.95rem; color: var(--text); outline: none; transition: border-color 0.2s; }
  .form-input:focus { border-color: var(--accent); }

  .color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-opt { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
  .color-opt.sel { border-color: white; transform: scale(1.2); }

  .emoji-picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .emoji-opt { width: 38px; height: 38px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface2); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .emoji-opt.sel { border-color: var(--accent); }

  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .btn-cancel { flex: 1; padding: 14px; border: 1px solid var(--border); background: transparent; border-radius: 12px; font-family: 'Onest', sans-serif; font-size: 0.85rem; color: var(--muted); cursor: pointer; }
  .btn-confirm { flex: 2; padding: 14px; border: none; border-radius: 12px; font-family: 'Unbounded', sans-serif; font-size: 0.65rem; font-weight: 700; color: var(--bg); cursor: pointer; background: var(--accent); letter-spacing: 0.05em; }
  .btn-confirm:active { transform: scale(0.97); }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .e { font-size: 2.5rem; margin-bottom: 12px; }
  .empty p { font-size: 0.85rem; }
  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>

<div class="header">
  <div class="header-tag">Особистий трекер</div>
  <h1>Твій <span>прогрес</span></h1>
</div>
<div class="sync-bar" id="syncBar">⏳ Підключення...</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('habits')">🔥 Звички</button>
  <button class="tab" onclick="switchTab('weight')">⚖️ Вага</button>
</div>

<div class="main">

  <!-- HABITS -->
  <div id="tab-habits">
    <div id="habitsList"><div class="loading">Завантаження...</div></div>
    <button class="add-habit-btn" onclick="openModal()">+ Додати звичку</button>
  </div>

  <!-- WEIGHT -->
  <div id="tab-weight" style="display:none">
    <div class="weight-input-card">
      <div class="weight-input-label">Моя вага</div>
      <div class="today-weight-display" id="todayVal">— <span>кг</span></div>
      <div class="weight-sub" id="todaySub">Сьогодні ще не записано</div>
      <div class="weight-enter-row">
        <input class="weight-big-input" id="wInput" type="number" step="0.1" min="30" max="300" placeholder="напр. 82.5" />
        <button class="btn-save-weight" onclick="saveWeight()">💾 Зберегти</button>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Крива ваги</div>
        <div class="period-btns">
          <button class="period-btn active" onclick="setPeriod(7,this)">7д</button>
          <button class="period-btn" onclick="setPeriod(30,this)">30д</button>
          <button class="period-btn" onclick="setPeriod(90,this)">3м</button>
          <button class="period-btn" onclick="setPeriod(0,this)">Все</button>
        </div>
      </div>
      <canvas id="wChart" height="160"></canvas>
      <div class="weight-stats">
        <div class="stat-box"><div class="stat-val" id="sMin">—</div><div class="stat-lbl">Мінімум</div></div>
        <div class="stat-box"><div class="stat-val" id="sMax">—</div><div class="stat-lbl">Максимум</div></div>
        <div class="stat-box"><div class="stat-val" id="sDiff">—</div><div class="stat-lbl">Зміна</div></div>
      </div>
    </div>

    <div class="weight-log">
      <div class="log-title">Історія записів</div>
      <div id="wLog"><div class="loading">Завантаження...</div></div>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="bgClose(event)">
  <div class="modal">
    <div class="modal-title">Нова звичка</div>
    <div class="form-group">
      <label class="form-label">Назва звички</label>
      <input class="form-input" id="hName" placeholder="Наприклад: Спорт, Читання, Вода..." />
    </div>
    <div class="form-group">
      <label class="form-label">Іконка</label>
      <div class="emoji-picker" id="emojiPick"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Колір</label>
      <div class="color-picker" id="colorPick"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Скасувати</button>
      <button class="btn-confirm" onclick="addHabit()">Додати</button>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://wfejkwjujpxflxvcrrsz.supabase.co';
const SB_KEY = 'sb_publishable_bvqcMBDSSXeLHCep4JNvNQ_la-JZcgu';
const db = supabase.createClient(SB_URL, SB_KEY);

const COLORS = ['#C8F542','#42F5C8','#F542A8','#F5A842','#A842F5','#42A8F5','#F55442','#42F590'];
const EMOJIS = ['🔥','💪','📚','🧘','🏃','🥗','💧','😴','🎯','✍️','🏋️','🚴','🧠','❤️'];

let habits=[], logs=[], weights=[], period=7;
let pickedColor=COLORS[0], pickedEmoji=EMOJIS[0];

function todayStr() { return new Date().toISOString().slice(0,10); }

function setSync(msg, cls) {
  const el = document.getElementById('syncBar');
  el.textContent = msg;
  el.className = 'sync-bar ' + (cls||'');
}

async function load() {
  try {
    const [h,l,w] = await Promise.all([
      db.from('tracker_habits').select('*').order('created_at'),
      db.from('tracker_logs').select('*'),
      db.from('tracker_weight').select('*').order('date',{ascending:false})
    ]);
    if(h.error) throw h.error;
    habits=h.data||[]; logs=l.data||[]; weights=w.data||[];
    renderHabits(); renderWeight(); drawChart();
    setSync('🟢 Синхронізовано','ok');
  } catch(e) {
    setSync('🔴 Помилка: '+e.message,'err');
  }
}

// ---- TABS ----
function switchTab(t) {
  document.getElementById('tab-habits').style.display = t==='habits'?'block':'none';
  document.getElementById('tab-weight').style.display = t==='weight'?'block':'none';
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',(i===0&&t==='habits')||(i===1&&t==='weight')));
  if(t==='weight') setTimeout(drawChart,50);
}

// ---- HABITS ----
function streak(hid) {
  let s=0, d=new Date();
  while(true){
    const ds=d.toISOString().slice(0,10);
    if(!logs.find(l=>l.habit_id===hid&&l.date===ds&&l.done)) break;
    s++; d.setDate(d.getDate()-1);
  }
  return s;
}

function renderHabits() {
  const el=document.getElementById('habitsList');
  if(!habits.length){
    el.innerHTML=`<div class="empty"><div class="e">🎯</div><p>Додай першу звичку і почни свій стрік!</p></div>`;
    return;
  }
  const days=[]; for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toISOString().slice(0,10));}
  const t=todayStr();
  el.innerHTML=habits.map(h=>{
    const s=streak(h.id);
    const total=logs.filter(l=>l.habit_id===h.id&&l.done).length;
    const dots=days.map(d=>{
      const done=logs.find(l=>l.habit_id===h.id&&l.date===d&&l.done);
      return `<div class="grid-dot${done?' done':''}${d===t?' today':''}" style="--habit-color:${h.color}" onclick="toggle('${h.id}','${d}')"></div>`;
    }).join('');
    return `<div class="habit-card" style="--habit-color:${h.color};border-left-color:${h.color}">
      <div class="habit-top">
        <div class="habit-icon" style="--habit-color:${h.color}">${h.icon}</div>
        <div class="habit-name">${esc(h.name)}</div>
        <div class="streak-badge">🔥 ${s}</div>
      </div>
      <div class="habit-grid">${dots}</div>
      <div class="habit-bottom">
        <div class="habit-stats">Всього: <span>${total}</span> днів</div>
        <button class="btn-del" onclick="delHabit('${h.id}')">✕</button>
      </div>
    </div>`;
  }).join('');
}

async function toggle(hid, date) {
  const ex=logs.find(l=>l.habit_id===hid&&l.date===date);
  if(ex){
    await db.from('tracker_logs').update({done:!ex.done}).eq('id',ex.id);
    ex.done=!ex.done;
  } else {
    const {data}=await db.from('tracker_logs').insert({habit_id:hid,date,done:true}).select().single();
    if(data) logs.push(data);
  }
  renderHabits();
}

async function delHabit(id) {
  if(!confirm('Видалити цю звичку?')) return;
  await db.from('tracker_logs').delete().eq('habit_id',id);
  await db.from('tracker_habits').delete().eq('id',id);
  habits=habits.filter(h=>h.id!==id);
  logs=logs.filter(l=>l.habit_id!==id);
  renderHabits();
}

// ---- ADD HABIT MODAL ----
function openModal() {
  pickedColor=COLORS[0]; pickedEmoji=EMOJIS[0];
  document.getElementById('hName').value='';

  document.getElementById('emojiPick').innerHTML=EMOJIS.map(e=>
    `<div class="emoji-opt${e===pickedEmoji?' sel':''}" onclick="pickEmoji('${e}',this)">${e}</div>`
  ).join('');

  document.getElementById('colorPick').innerHTML=COLORS.map(c=>
    `<div class="color-opt${c===pickedColor?' sel':''}" style="background:${c}" onclick="pickColor('${c}',this)"></div>`
  ).join('');

  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('hName').focus(),300);
}

function pickEmoji(e,el) { pickedEmoji=e; document.querySelectorAll('.emoji-opt').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); }
function pickColor(c,el) { pickedColor=c; document.querySelectorAll('.color-opt').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function bgClose(e) { if(e.target.id==='modal') closeModal(); }

async function addHabit() {
  const name=document.getElementById('hName').value.trim();
  if(!name){ document.getElementById('hName').focus(); return; }
  setSync('⏳ Зберігаємо...','');
  const {data,error}=await db.from('tracker_habits').insert({name,icon:pickedEmoji,color:pickedColor}).select().single();
  if(error){ setSync('🔴 '+error.message,'err'); return; }
  habits.push(data);
  closeModal();
  renderHabits();
  setSync('🟢 Збережено','ok');
}

// ---- WEIGHT ----
async function saveWeight() {
  const val=parseFloat(document.getElementById('wInput').value);
  if(!val||val<30||val>300){ document.getElementById('wInput').focus(); return; }
  const t=todayStr();
  setSync('⏳ Зберігаємо...','');
  const ex=weights.find(w=>w.date===t);
  if(ex){
    await db.from('tracker_weight').update({kg:val}).eq('id',ex.id);
    ex.kg=val;
  } else {
    const {data}=await db.from('tracker_weight').insert({date:t,kg:val}).select().single();
    if(data) weights.unshift(data);
  }
  document.getElementById('wInput').value='';
  renderWeight(); drawChart();
  setSync('🟢 Збережено','ok');
}

function renderWeight() {
  const t=todayStr();
  const todayW=weights.find(w=>w.date===t);
  document.getElementById('todayVal').innerHTML=todayW?`${todayW.kg} <span>кг</span>`:`— <span>кг</span>`;
  document.getElementById('todaySub').textContent=todayW?`Записано сьогодні о ${new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})}`:'Введи вагу нижче і натисни Зберегти';

  const logEl=document.getElementById('wLog');
  if(!weights.length){
    logEl.innerHTML=`<div class="empty" style="padding:20px"><div class="e">📊</div><p>Записуй вагу щодня щоб бачити прогрес</p></div>`;
    return;
  }
  const sorted=[...weights].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);
  logEl.innerHTML=sorted.map((w,i)=>{
    const prev=sorted[i+1];
    let diff='—', cls='';
    if(prev){ const d=(w.kg-prev.kg).toFixed(1); diff=(d>0?'+':'')+d; cls=d>0?'up':'down'; }
    const isT=w.date===t;
    return `<div class="log-row">
      <div class="log-date${isT?' today-label':''}">${isT?'Сьогодні':fmtDate(w.date)}</div>
      <div class="log-kg">${w.kg} кг</div>
      <div class="log-diff ${cls}">${diff}</div>
    </div>`;
  }).join('');

  if(weights.length){
    const kgs=weights.map(w=>w.kg);
    const mn=Math.min(...kgs), mx=Math.max(...kgs);
    const sorted2=[...weights].sort((a,b)=>a.date.localeCompare(b.date));
    const diff=(sorted2[sorted2.length-1].kg-sorted2[0].kg).toFixed(1);
    document.getElementById('sMin').textContent=mn+' кг';
    document.getElementById('sMax').textContent=mx+' кг';
    document.getElementById('sDiff').textContent=(diff>0?'+':'')+diff+' кг';
  }
}

function setPeriod(p,btn) {
  period=p;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  drawChart();
}

function drawChart() {
  const canvas=document.getElementById('wChart');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  let data=[...weights].sort((a,b)=>a.date.localeCompare(b.date));
  if(period>0){
    const cut=new Date(); cut.setDate(cut.getDate()-period);
    data=data.filter(w=>new Date(w.date)>=cut);
  }
  const W=canvas.offsetWidth||window.innerWidth-40||320, H=160;
  canvas.width=W; canvas.height=H;
  ctx.clearRect(0,0,W,H);
  if(!data.length){
    ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.font='12px Onest';
    ctx.textAlign='center';
    ctx.fillText('Немає даних за цей період',W/2,H/2);
    return;
  }
  const kgs=data.map(d=>d.kg);
  const mn=Math.min(...kgs)-0.5, mx=Math.max(...kgs)+0.5, rng=mx-mn||1;
  const pad={t:10,r:10,b:28,l:38};
  const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const xp=i=>pad.l+(i/Math.max(data.length-1,1))*cw;
  const yp=kg=>pad.t+(1-(kg-mn)/rng)*ch;

  // Grid lines
  for(let i=0;i<=4;i++){
    const y=pad.t+(i/4)*ch;
    ctx.strokeStyle='rgba(255,255,255,0.05)';
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.font='9px Onest';
    ctx.textAlign='right';
    ctx.fillText((mx-(i/4)*rng).toFixed(1),pad.l-4,y+3);
  }

  // Fill
  const g=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
  g.addColorStop(0,'rgba(66,245,200,0.25)');
  g.addColorStop(1,'rgba(66,245,200,0)');
  ctx.beginPath();
  ctx.moveTo(xp(0),yp(data[0].kg));
  for(let i=1;i<data.length;i++){
    const cx=(xp(i-1)+xp(i))/2;
    ctx.bezierCurveTo(cx,yp(data[i-1].kg),cx,yp(data[i].kg),xp(i),yp(data[i].kg));
  }
  ctx.lineTo(xp(data.length-1),H-pad.b);
  ctx.lineTo(xp(0),H-pad.b);
  ctx.closePath();
  ctx.fillStyle=g; ctx.fill();

  // Line
  ctx.beginPath();
  ctx.moveTo(xp(0),yp(data[0].kg));
  for(let i=1;i<data.length;i++){
    const cx=(xp(i-1)+xp(i))/2;
    ctx.bezierCurveTo(cx,yp(data[i-1].kg),cx,yp(data[i].kg),xp(i),yp(data[i].kg));
  }
  ctx.strokeStyle='#42F5C8'; ctx.lineWidth=2.5; ctx.stroke();

  // Dots
  data.forEach((d,i)=>{
    ctx.beginPath(); ctx.arc(xp(i),yp(d.kg),3,0,Math.PI*2);
    ctx.fillStyle='#42F5C8'; ctx.fill();
  });

  // X labels
  ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.font='9px Onest'; ctx.textAlign='center';
  const step=Math.ceil(data.length/5);
  data.forEach((d,i)=>{
    if(i%step===0||i===data.length-1){
      const p=d.date.split('-');
      ctx.fillText(`${p[2]}.${p[1]}`,xp(i),H-8);
    }
  });
}

function fmtDate(s) {
  return new Date(s).toLocaleDateString('uk-UA',{day:'numeric',month:'short'});
}
function esc(s){ return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''; }

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(document.activeElement?.id==='wInput') saveWeight();
    if(document.activeElement?.id==='hName') addHabit();
  }
});

load();
</script>
