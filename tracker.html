<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер Юри</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700&family=Onest:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0A0A0F;
    --surface: #13131A;
    --surface2: #1C1C26;
    --border: #2A2A38;
    --text: #F0EFE8;
    --muted: #6B6A7A;
    --accent: #C8F542;
    --accent2: #42F5C8;
    --red: #F55442;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Onest', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px; }

  .header { padding: 48px 20px 16px; }
  .header-tag { font-family: 'Unbounded', sans-serif; font-size: 0.6rem; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-family: 'Unbounded', sans-serif; font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 700; letter-spacing: -0.02em; }
  .header h1 span { color: var(--accent); }
  .month-label { font-family: 'Unbounded', sans-serif; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

  .sync-bar { text-align: center; font-size: 0.7rem; padding: 4px 20px 10px; color: var(--muted); }
  .sync-bar.ok { color: var(--accent); }
  .sync-bar.err { color: var(--red); }

  .tabs { display: flex; gap: 4px; padding: 0 20px 20px; }
  .tab { flex: 1; padding: 10px 6px; border: 1px solid var(--border); background: transparent; border-radius: 12px; font-family: 'Unbounded', sans-serif; font-size: 0.55rem; letter-spacing: 0.04em; color: var(--muted); cursor: pointer; transition: all 0.2s; text-transform: uppercase; white-space: nowrap; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .main { padding: 0 20px; }

  /* ── HABIT CARD ── */
  .habit-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 12px;
    border-left: 3px solid var(--hc, var(--accent));
    animation: fadeUp 0.3s ease;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  /* Top row: icon + name + check button */
  .habit-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .habit-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--hc, var(--accent)) 20%, transparent);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .habit-info { flex: 1; min-width: 0; }
  .habit-name { font-family: 'Unbounded', sans-serif; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .streak-badge { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
  .streak-badge b { color: var(--accent); }

  /* Big check circle */
  .check-today {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 2.5px solid var(--hc, var(--accent));
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
    font-size: 20px;
  }
  .check-today.done {
    background: var(--hc, var(--accent));
    border-color: var(--hc, var(--accent));
  }
  .check-today:active { transform: scale(0.88); }

  /* Month grid */
  .month-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .month-nav-label { font-size: 0.65rem; color: var(--muted); font-family: 'Unbounded', sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
  .month-nav-btn {
    width: 24px; height: 24px;
    border: none; background: transparent;
    color: var(--muted); cursor: pointer;
    font-size: 14px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.15s;
  }
  .month-nav-btn:hover { color: var(--text); }

  .dow-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 4px;
  }
  .dow-cell { text-align: center; font-size: 7px; color: var(--muted); padding: 2px 0; }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .day-cell {
    aspect-ratio: 1;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .day-cell.empty { cursor: default; }
  .day-cell.future { opacity: 0.3; cursor: default; pointer-events: none; }
  .day-cell.done {
    background: var(--hc, var(--accent));
    color: var(--bg);
    font-weight: 600;
  }
  .day-cell.today-cell {
    outline: 2px solid var(--hc, var(--accent));
    outline-offset: 1px;
    color: var(--text);
  }
  .day-cell.today-cell.done { outline: none; }
  .day-cell:not(.empty):not(.future):not(.done):hover {
    background: color-mix(in srgb, var(--hc, var(--accent)) 20%, transparent);
    color: var(--text);
  }

  /* Card footer */
  .habit-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .habit-stats-sm { font-size: 0.7rem; color: var(--muted); }
  .habit-stats-sm b { color: var(--text); }
  .btn-del-habit {
    padding: 6px 12px;
    border: 1px solid rgba(245,84,66,0.3);
    background: rgba(245,84,66,0.06);
    border-radius: 8px;
    color: var(--red);
    cursor: pointer;
    font-size: 0.7rem;
    font-family: 'Onest', sans-serif;
    transition: all 0.2s;
  }
  .btn-del-habit:hover { background: rgba(245,84,66,0.18); }

  .add-habit-btn {
    width: 100%; padding: 16px;
    border: 1.5px dashed var(--border);
    background: transparent; border-radius: 16px;
    font-family: 'Onest', sans-serif; font-size: 0.9rem;
    color: var(--muted); cursor: pointer; transition: all 0.2s;
    margin-bottom: 20px;
  }
  .add-habit-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── WEIGHT ── */
  .weight-input-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px 20px; margin-bottom: 16px; }
  .weight-input-label { font-family: 'Unbounded', sans-serif; font-size: 0.65rem; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
  .today-weight-display { font-family: 'Unbounded', sans-serif; font-size: 3rem; font-weight: 700; color: var(--accent2); line-height: 1; margin-bottom: 4px; }
  .today-weight-display span { font-size: 1.2rem; color: var(--muted); font-weight: 300; }
  .weight-sub { font-size: 0.75rem; color: var(--muted); margin-bottom: 20px; }
  .weight-enter-row { display: flex; gap: 10px; }
  .weight-big-input { flex: 1; padding: 16px; background: var(--surface2); border: 2px solid var(--border); border-radius: 14px; font-family: 'Unbounded', sans-serif; font-size: 1.4rem; color: var(--text); text-align: center; outline: none; transition: border-color 0.2s; }
  .weight-big-input:focus { border-color: var(--accent2); }
  .weight-big-input::placeholder { color: var(--muted); font-size: 1rem; }
  .btn-save-weight { flex: 1; padding: 16px; background: var(--accent2); border: none; border-radius: 14px; font-family: 'Unbounded', sans-serif; font-size: 0.7rem; font-weight: 700; color: var(--bg); cursor: pointer; transition: all 0.2s; }
  .btn-save-weight:active { transform: scale(0.97); }

  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
  .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .chart-title { font-family: 'Unbounded', sans-serif; font-size: 0.65rem; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
  .period-btns { display: flex; gap: 4px; }
  .period-btn { padding: 5px 10px; border: 1px solid var(--border); background: transparent; border-radius: 6px; font-family: 'Unbounded', sans-serif; font-size: 0.55rem; color: var(--muted); cursor: pointer; transition: all 0.2s; }
  .period-btn.active { border-color: var(--accent2); color: var(--accent2); background: var(--surface2); }
  canvas { width: 100% !important; display: block; }
  .weight-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .stat-box { background: var(--surface2); border-radius: 12px; padding: 12px; text-align: center; }
  .stat-val { font-family: 'Unbounded', sans-serif; font-size: 0.95rem; font-weight: 600; color: var(--accent2); margin-bottom: 4px; }
  .stat-lbl { font-size: 0.65rem; color: var(--muted); }
  .weight-log { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }
  .log-title { font-family: 'Unbounded', sans-serif; font-size: 0.65rem; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; margin-bottom: 14px; }
  .log-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .log-row:last-child { border-bottom: none; }
  .log-date { font-size: 0.8rem; color: var(--muted); }
  .log-date.tl { color: var(--accent2); font-weight: 500; }
  .log-kg { font-family: 'Unbounded', sans-serif; font-size: 0.9rem; }
  .log-diff { font-size: 0.75rem; font-weight: 500; min-width: 44px; text-align: right; }
  .log-diff.up { color: var(--red); }
  .log-diff.dn { color: var(--accent); }

  /* ── ANALYTICS ── */
  .analytics-period { display: flex; gap: 4px; margin-bottom: 20px; }
  .a-btn { flex: 1; padding: 10px 4px; border: 1px solid var(--border); background: transparent; border-radius: 10px; font-family: 'Unbounded', sans-serif; font-size: 0.5rem; color: var(--muted); cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.04em; }
  .a-btn.active { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
  .analytics-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
  .analytics-title { font-family: 'Unbounded', sans-serif; font-size: 0.65rem; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; margin-bottom: 16px; }
  .habit-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .habit-bar-icon { font-size: 16px; flex-shrink: 0; }
  .habit-bar-name { font-size: 0.75rem; min-width: 70px; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .habit-bar-track { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .habit-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
  .habit-bar-pct { font-family: 'Unbounded', sans-serif; font-size: 0.65rem; color: var(--muted); min-width: 36px; text-align: right; }
  .streak-list { display: flex; flex-direction: column; gap: 8px; }
  .streak-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface2); border-radius: 12px; }
  .streak-left { display: flex; align-items: center; gap: 10px; }
  .streak-nums { text-align: right; }
  .streak-cur { font-family: 'Unbounded', sans-serif; font-size: 1rem; color: var(--accent); }
  .streak-cur span { font-size: 0.6rem; color: var(--muted); font-family: 'Onest', sans-serif; }
  .streak-total { font-size: 0.65rem; color: var(--muted); }

  /* ── MODAL ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,10,15,0.92); z-index: 100; align-items: flex-end; justify-content: center; backdrop-filter: blur(10px); }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 24px 24px 0 0; padding: 24px 20px 48px; width: 100%; max-width: 600px; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-family: 'Unbounded', sans-serif; font-size: 1rem; font-weight: 600; margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; display: block; font-family: 'Unbounded', sans-serif; }
  .form-input { width: 100%; padding: 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; font-family: 'Onest', sans-serif; font-size: 0.95rem; color: var(--text); outline: none; transition: border-color 0.2s; }
  .form-input:focus { border-color: var(--accent); }
  .color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-opt { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
  .color-opt.sel { border-color: white; transform: scale(1.2); }
  .emoji-picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .emoji-opt { width: 38px; height: 38px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface2); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .emoji-opt.sel { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .btn-cancel { flex: 1; padding: 14px; border: 1px solid var(--border); background: transparent; border-radius: 12px; font-family: 'Onest', sans-serif; font-size: 0.85rem; color: var(--muted); cursor: pointer; }
  .btn-confirm { flex: 2; padding: 14px; border: none; border-radius: 12px; font-family: 'Unbounded', sans-serif; font-size: 0.65rem; font-weight: 700; color: var(--bg); cursor: pointer; background: var(--accent); }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .e { font-size: 2.5rem; margin-bottom: 12px; }
  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>

<div class="header">
  <div class="header-tag">Особистий трекер</div>
  <div class="header-row">
    <h1>Твій <span>прогрес</span></h1>
    <div class="month-label" id="curMonthLabel"></div>
  </div>
</div>
<div class="sync-bar" id="syncBar">⏳ Підключення...</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('habits')">🔥 Звички</button>
  <button class="tab" onclick="switchTab('weight')">⚖️ Вага</button>
  <button class="tab" onclick="switchTab('analytics')">📊 Аналітика</button>
</div>

<div class="main">

  <!-- HABITS -->
  <div id="tab-habits">
    <div id="habitsList"><div class="loading">Завантаження...</div></div>
    <button class="add-habit-btn" onclick="openModal()">+ Додати нову звичку</button>
  </div>

  <!-- WEIGHT -->
  <div id="tab-weight" style="display:none">
    <div class="weight-input-card">
      <div class="weight-input-label">Моя вага сьогодні</div>
      <div class="today-weight-display" id="todayVal">— <span>кг</span></div>
      <div class="weight-sub" id="todaySub">Введи вагу нижче і натисни Зберегти</div>
      <div class="weight-enter-row">
        <input class="weight-big-input" id="wInput" type="number" step="0.1" min="30" max="300" placeholder="напр. 82.5" />
        <button class="btn-save-weight" onclick="saveWeight()">💾 Зберегти</button>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Крива ваги</div>
        <div class="period-btns">
          <button class="period-btn active" onclick="setWP(7,this)">7д</button>
          <button class="period-btn" onclick="setWP(30,this)">30д</button>
          <button class="period-btn" onclick="setWP(90,this)">3м</button>
          <button class="period-btn" onclick="setWP(0,this)">Все</button>
        </div>
      </div>
      <canvas id="wChart" height="160"></canvas>
      <div class="weight-stats">
        <div class="stat-box"><div class="stat-val" id="sMin">—</div><div class="stat-lbl">Мінімум</div></div>
        <div class="stat-box"><div class="stat-val" id="sMax">—</div><div class="stat-lbl">Максимум</div></div>
        <div class="stat-box"><div class="stat-val" id="sDiff">—</div><div class="stat-lbl">Зміна</div></div>
      </div>
    </div>
    <div class="weight-log">
      <div class="log-title">Історія записів</div>
      <div id="wLog"><div class="loading">...</div></div>
    </div>
  </div>

  <!-- ANALYTICS -->
  <div id="tab-analytics" style="display:none">
    <div class="analytics-period">
      <button class="a-btn active" onclick="setAP(7,this)">7 днів</button>
      <button class="a-btn" onclick="setAP(14,this)">2 тижні</button>
      <button class="a-btn" onclick="setAP(30,this)">Місяць</button>
      <button class="a-btn" onclick="setAP(90,this)">3 місяці</button>
    </div>
    <div class="analytics-card">
      <div class="analytics-title">Виконання за період</div>
      <div id="aRates"></div>
    </div>
    <div class="analytics-card">
      <div class="analytics-title">Поточні стріки 🔥</div>
      <div class="streak-list" id="aStreaks"></div>
    </div>
    <div class="analytics-card">
      <div class="analytics-title">Звичок виконано по днях</div>
      <canvas id="aChart" height="160"></canvas>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="bgClose(event)">
  <div class="modal">
    <div class="modal-title">Нова звичка</div>
    <div class="form-group">
      <label class="form-label">Назва</label>
      <input class="form-input" id="hName" placeholder="Наприклад: Спорт, Читання, Вода..." />
    </div>
    <div class="form-group">
      <label class="form-label">Іконка</label>
      <div class="emoji-picker" id="emojiPick"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Колір</label>
      <div class="color-picker" id="colorPick"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Скасувати</button>
      <button class="btn-confirm" onclick="addHabit()">Додати</button>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://wfejkwjujpxflxvcrrsz.supabase.co';
const SB_KEY = 'sb_publishable_bvqcMBDSSXeLHCep4JNvNQ_la-JZcgu';
const db = supabase.createClient(SB_URL, SB_KEY);

const COLORS = ['#C8F542','#42F5C8','#F542A8','#F5A842','#A842F5','#42A8F5','#F55442','#42F590'];
const EMOJIS = ['🔥','💪','📚','🧘','🏃','🥗','💧','😴','🎯','✍️','🏋️','🚴','🧠','❤️'];
const DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
const MONTHS_UA = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];

let habits=[], logs=[], weights=[];
let wPeriod=7, aPeriod=7;
let pColor=COLORS[0], pEmoji=EMOJIS[0];

// Per-habit displayed month (year-month string like "2026-05")
let habitMonth = {};

function todayStr() { return new Date().toISOString().slice(0,10); }
function ymStr(y,m) { return `${y}-${String(m+1).padStart(2,'0')}`; }
function curYM() { const n=new Date(); return ymStr(n.getFullYear(),n.getMonth()); }

function setSync(msg,cls){ const e=document.getElementById('syncBar'); e.textContent=msg; e.className='sync-bar '+(cls||''); }

async function load() {
  try {
    const [h,l,w]=await Promise.all([
      db.from('tracker_habits').select('*').order('created_at'),
      db.from('tracker_logs').select('*'),
      db.from('tracker_weight').select('*').order('date',{ascending:false})
    ]);
    if(h.error) throw h.error;
    habits=h.data||[]; logs=l.data||[]; weights=w.data||[];
    // init habit months
    habits.forEach(h=>{ if(!habitMonth[h.id]) habitMonth[h.id]=curYM(); });
    renderHabits(); renderWeight();
    setSync('🟢 Синхронізовано','ok');
  } catch(e){ setSync('🔴 '+e.message,'err'); }
}

// ── TABS ──
function switchTab(t){
  ['habits','weight','analytics'].forEach(id=>{
    document.getElementById('tab-'+id).style.display=id===t?'block':'none';
  });
  document.querySelectorAll('.tab').forEach((b,i)=>{
    b.classList.toggle('active',['habits','weight','analytics'][i]===t);
  });
  if(t==='weight') setTimeout(drawWChart,50);
  if(t==='analytics') setTimeout(renderAnalytics,50);
}

// ── MONTH CALENDAR HELPERS ──
function daysInMonth(year, month) { return new Date(year, month+1, 0).getDate(); }
function firstDow(year, month) {
  // Monday=0
  let d = new Date(year, month, 1).getDay();
  return (d+6)%7;
}

function parseYM(ym) {
  const [y,m]=ym.split('-').map(Number);
  return {y,m:m-1};
}

// ── RENDER HABITS ──
function renderHabits(){
  // update month label in header
  const {y,m}=parseYM(curYM());
  document.getElementById('curMonthLabel').textContent=MONTHS_UA[m]+' '+y;

  const el=document.getElementById('habitsList');
  if(!habits.length){
    el.innerHTML=`<div class="empty"><div class="e">🎯</div><p>Додай першу звичку і почни відстежувати прогрес!</p></div>`;
    return;
  }
  el.innerHTML=habits.map(h=>buildHabitCard(h)).join('');
}

function buildHabitCard(h){
  if(!habitMonth[h.id]) habitMonth[h.id]=curYM();
  const ym=habitMonth[h.id];
  const {y,m}=parseYM(ym);
  const t=todayStr();
  const todayDone=logs.find(l=>l.habit_id===h.id&&l.date===t&&l.done);
  const s=streak(h.id);
  const total=logs.filter(l=>l.habit_id===h.id&&l.done).length;

  // Calendar
  const dim=daysInMonth(y,m);
  const fd=firstDow(y,m);
  const monthStr=MONTHS_UA[m]+' '+y;

  // dow row
  const dowHtml=DOW.map(d=>`<div class="dow-cell">${d}</div>`).join('');

  // day cells
  let dayCells='';
  // empty leading cells
  for(let i=0;i<fd;i++) dayCells+=`<div class="day-cell empty"></div>`;

  const todayDate=new Date(t);

  for(let day=1;day<=dim;day++){
    const dateStr=`${ym}-${String(day).padStart(2,'0')}`;
    const cellDate=new Date(dateStr);
    const isFuture=cellDate>todayDate;
    const isToday=dateStr===t;
    const done=logs.find(l=>l.habit_id===h.id&&l.date===dateStr&&l.done);
    let cls='day-cell';
    if(done) cls+=' done';
    if(isToday) cls+=' today-cell';
    if(isFuture) cls+=' future';
    dayCells+=`<div class="${cls}" style="--hc:${h.color}" onclick="toggleDay('${h.id}','${dateStr}')">${day}</div>`;
  }

  const isCurrentMonth = ym===curYM();
  const prevDisabled = ''; // allow going back
  const nextDisabled = isCurrentMonth ? 'opacity:0.3;pointer-events:none' : '';

  return `<div class="habit-card" style="--hc:${h.color};border-left-color:${h.color}">
    <div class="habit-top">
      <div class="habit-icon" style="--hc:${h.color}">${h.icon}</div>
      <div class="habit-info">
        <div class="habit-name">${esc(h.name)}</div>
        <div class="streak-badge">🔥 <b>${s}</b> днів поспіль · всього <b>${total}</b></div>
      </div>
      <button class="check-today ${todayDone?'done':''}" style="--hc:${h.color}" onclick="checkToday('${h.id}')">
        ${todayDone?'✓':''}
      </button>
    </div>

    <div class="month-header">
      <button class="month-nav-btn" onclick="changeMonth('${h.id}',-1)">‹</button>
      <div class="month-nav-label">${monthStr}</div>
      <button class="month-nav-btn" style="${nextDisabled}" onclick="changeMonth('${h.id}',1)">›</button>
    </div>
    <div class="dow-row">${dowHtml}</div>
    <div class="days-grid">${dayCells}</div>

    <div class="habit-footer">
      <div class="habit-stats-sm">За місяць: <b>${logs.filter(l=>l.habit_id===h.id&&l.date.startsWith(ym)&&l.done).length}</b> / ${dim} днів</div>
      <button class="btn-del-habit" onclick="delHabit('${h.id}')">🗑 Видалити</button>
    </div>
  </div>`;
}

function changeMonth(hid, dir){
  const ym=habitMonth[hid]||curYM();
  const {y,m}=parseYM(ym);
  const nd=new Date(y,m+dir,1);
  const newYM=ymStr(nd.getFullYear(),nd.getMonth());
  // don't go into future months
  if(newYM>curYM()) return;
  habitMonth[hid]=newYM;
  renderHabits();
}

async function checkToday(hid){
  const t=todayStr();
  await toggleDay(hid, t);
}

async function toggleDay(hid, date){
  const ex=logs.find(l=>l.habit_id===hid&&l.date===date);
  if(ex){
    await db.from('tracker_logs').update({done:!ex.done}).eq('id',ex.id);
    ex.done=!ex.done;
  } else {
    const {data}=await db.from('tracker_logs').insert({habit_id:hid,date,done:true}).select().single();
    if(data) logs.push(data);
  }
  renderHabits();
  setSync('🟢 Збережено','ok');
}

async function delHabit(id){
  if(!confirm('Видалити цю звичку і всю її історію?')) return;
  await db.from('tracker_logs').delete().eq('habit_id',id);
  await db.from('tracker_habits').delete().eq('id',id);
  habits=habits.filter(h=>h.id!==id);
  logs=logs.filter(l=>l.habit_id!==id);
  delete habitMonth[id];
  renderHabits();
}

function streak(hid){
  let s=0; const d=new Date();
  while(true){
    const ds=d.toISOString().slice(0,10);
    if(!logs.find(l=>l.habit_id===hid&&l.date===ds&&l.done)) break;
    s++; d.setDate(d.getDate()-1);
  }
  return s;
}

// ── ADD HABIT ──
function openModal(){
  pColor=COLORS[0]; pEmoji=EMOJIS[0];
  document.getElementById('hName').value='';
  document.getElementById('emojiPick').innerHTML=EMOJIS.map(e=>
    `<div class="emoji-opt${e===pEmoji?' sel':''}" onclick="pe('${e}',this)">${e}</div>`
  ).join('');
  document.getElementById('colorPick').innerHTML=COLORS.map(c=>
    `<div class="color-opt${c===pColor?' sel':''}" style="background:${c}" onclick="pc('${c}',this)"></div>`
  ).join('');
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('hName').focus(),300);
}
function pe(e,el){ pEmoji=e; document.querySelectorAll('.emoji-opt').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); }
function pc(c,el){ pColor=c; document.querySelectorAll('.color-opt').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); }
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
function bgClose(e){ if(e.target.id==='modal') closeModal(); }

async function addHabit(){
  const name=document.getElementById('hName').value.trim();
  if(!name){ document.getElementById('hName').focus(); return; }
  setSync('⏳ Зберігаємо...','');
  const {data,error}=await db.from('tracker_habits').insert({name,icon:pEmoji,color:pColor}).select().single();
  if(error){ setSync('🔴 '+error.message,'err'); return; }
  habits.push(data);
  habitMonth[data.id]=curYM();
  closeModal(); renderHabits();
  setSync('🟢 Збережено','ok');
}

// ── WEIGHT ──
let wPer=7;
async function saveWeight(){
  const val=parseFloat(document.getElementById('wInput').value);
  if(!val||val<30||val>300){ document.getElementById('wInput').focus(); return; }
  const t=todayStr();
  const ex=weights.find(w=>w.date===t);
  if(ex){
    await db.from('tracker_weight').update({kg:val}).eq('id',ex.id);
    ex.kg=val;
  } else {
    const {data}=await db.from('tracker_weight').insert({date:t,kg:val}).select().single();
    if(data) weights.unshift(data);
  }
  document.getElementById('wInput').value='';
  renderWeight(); drawWChart();
  setSync('🟢 Збережено','ok');
}
function renderWeight(){
  const t=todayStr();
  const tw=weights.find(w=>w.date===t);
  document.getElementById('todayVal').innerHTML=tw?`${tw.kg} <span>кг</span>`:`— <span>кг</span>`;
  document.getElementById('todaySub').textContent=tw?'Записано сьогодні ✓':'Введи вагу нижче і натисни Зберегти';
  const logEl=document.getElementById('wLog');
  if(!weights.length){ logEl.innerHTML=`<div class="empty" style="padding:20px"><div class="e">📊</div><p>Записуй вагу щодня</p></div>`; return; }
  const sorted=[...weights].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15);
  logEl.innerHTML=sorted.map((w,i)=>{
    const prev=sorted[i+1];
    let diff='—',cls='';
    if(prev){ const d=(w.kg-prev.kg).toFixed(1); diff=(d>0?'+':'')+d; cls=d>0?'up':'dn'; }
    const isT=w.date===t;
    return `<div class="log-row">
      <div class="log-date${isT?' tl':''}">${isT?'Сьогодні':fmtDate(w.date)}</div>
      <div class="log-kg">${w.kg} кг</div>
      <div class="log-diff ${cls}">${diff}</div>
    </div>`;
  }).join('');
  if(weights.length){
    const kgs=weights.map(w=>w.kg);
    const mn=Math.min(...kgs),mx=Math.max(...kgs);
    const s2=[...weights].sort((a,b)=>a.date.localeCompare(b.date));
    const d=(s2[s2.length-1].kg-s2[0].kg).toFixed(1);
    document.getElementById('sMin').textContent=mn+' кг';
    document.getElementById('sMax').textContent=mx+' кг';
    document.getElementById('sDiff').textContent=(d>0?'+':'')+d+' кг';
  }
}
function setWP(p,btn){ wPer=p; document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); drawWChart(); }
function drawWChart(){
  const canvas=document.getElementById('wChart'); if(!canvas) return;
  const ctx=canvas.getContext('2d');
  let data=[...weights].sort((a,b)=>a.date.localeCompare(b.date));
  if(wPer>0){ const cut=new Date(); cut.setDate(cut.getDate()-wPer); data=data.filter(w=>new Date(w.date)>=cut); }
  const W=canvas.offsetWidth||320,H=160;
  canvas.width=W; canvas.height=H; ctx.clearRect(0,0,W,H);
  if(!data.length){ ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.font='12px Onest'; ctx.textAlign='center'; ctx.fillText('Немає даних',W/2,H/2); return; }
  drawLine(ctx,data.map(d=>({x:d.date,y:d.kg})),W,H,'#42F5C8');
}

function drawLine(ctx,data,W,H,color){
  const ys=data.map(d=>d.y);
  const mn=Math.min(...ys)-0.5,mx=Math.max(...ys)+0.5,rng=mx-mn||1;
  const pad={t:10,r:10,b:28,l:38};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const xp=i=>pad.l+(i/Math.max(data.length-1,1))*cw;
  const yp=v=>pad.t+(1-(v-mn)/rng)*ch;
  for(let i=0;i<=4;i++){
    const y=pad.t+(i/4)*ch;
    ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.font='9px Onest'; ctx.textAlign='right';
    ctx.fillText((mx-(i/4)*rng).toFixed(1),pad.l-4,y+3);
  }
  const g=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
  g.addColorStop(0,color+'40'); g.addColorStop(1,color+'00');
  ctx.beginPath(); ctx.moveTo(xp(0),yp(data[0].y));
  for(let i=1;i<data.length;i++){ const cx=(xp(i-1)+xp(i))/2; ctx.bezierCurveTo(cx,yp(data[i-1].y),cx,yp(data[i].y),xp(i),yp(data[i].y)); }
  ctx.lineTo(xp(data.length-1),H-pad.b); ctx.lineTo(xp(0),H-pad.b); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); ctx.moveTo(xp(0),yp(data[0].y));
  for(let i=1;i<data.length;i++){ const cx=(xp(i-1)+xp(i))/2; ctx.bezierCurveTo(cx,yp(data[i-1].y),cx,yp(data[i].y),xp(i),yp(data[i].y)); }
  ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.stroke();
  data.forEach((d,i)=>{ ctx.beginPath(); ctx.arc(xp(i),yp(d.y),3,0,Math.PI*2); ctx.fillStyle=color; ctx.fill(); });
  ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.font='9px Onest'; ctx.textAlign='center';
  const step=Math.ceil(data.length/5);
  data.forEach((d,i)=>{ if(i%step===0||i===data.length-1){ const p=d.x.split('-'); ctx.fillText(`${p[2]}.${p[1]}`,xp(i),H-8); } });
}

// ── ANALYTICS ──
let aPer=7;
function setAP(p,btn){ aPer=p; document.querySelectorAll('.a-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderAnalytics(); }

function getDays(n){ const days=[]; for(let i=n-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); } return days; }

function renderAnalytics(){
  if(!habits.length){ document.getElementById('aRates').innerHTML=`<div class="empty"><p>Додай звички спочатку</p></div>`; return; }
  const days=getDays(aPer);
  // Rates
  document.getElementById('aRates').innerHTML=habits.map(h=>{
    const done=days.filter(d=>logs.find(l=>l.habit_id===h.id&&l.date===d&&l.done)).length;
    const pct=Math.round((done/days.length)*100);
    return `<div class="habit-bar-row">
      <div class="habit-bar-icon">${h.icon}</div>
      <div class="habit-bar-name">${esc(h.name)}</div>
      <div class="habit-bar-track"><div class="habit-bar-fill" style="width:${pct}%;background:${h.color}"></div></div>
      <div class="habit-bar-pct">${pct}%</div>
    </div>`;
  }).join('');
  // Streaks
  const ss=[...habits].map(h=>({...h,s:streak(h.id),total:logs.filter(l=>l.habit_id===h.id&&l.done).length})).sort((a,b)=>b.s-a.s);
  document.getElementById('aStreaks').innerHTML=ss.map(h=>`
    <div class="streak-row">
      <div class="streak-left"><span style="font-size:16px">${h.icon}</span><span style="font-size:0.8rem">${esc(h.name)}</span></div>
      <div class="streak-nums"><div class="streak-cur">${h.s} <span>днів поспіль</span></div><div class="streak-total">Всього: ${h.total}</div></div>
    </div>`).join('');
  // Bar chart
  const canvas=document.getElementById('aChart'); if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const W=canvas.offsetWidth||320,H=160;
  canvas.width=W; canvas.height=H; ctx.clearRect(0,0,W,H);
  const counts=days.map(d=>({ x:d, y:habits.filter(h=>logs.find(l=>l.habit_id===h.id&&l.date===d&&l.done)).length }));
  const maxY=Math.max(...counts.map(c=>c.y),1);
  const pad={t:10,r:10,b:28,l:24};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const bw=Math.max(4,(cw/days.length)-3);
  const t=todayStr();
  counts.forEach((c,i)=>{
    const x=pad.l+(i/days.length)*cw;
    const bh=(c.y/maxY)*ch, y=pad.t+ch-bh;
    ctx.fillStyle=c.x===t?'#C8F542':'rgba(200,245,66,0.3)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,y,bw,bh,3); else ctx.rect(x,y,bw,bh);
    ctx.fill();
  });
  ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.font='9px Onest'; ctx.textAlign='center';
  const step=Math.ceil(days.length/5);
  days.forEach((d,i)=>{ if(i%step===0||i===days.length-1){ const p=d.split('-'); ctx.fillText(`${p[2]}.${p[1]}`,pad.l+(i/days.length)*cw+bw/2,H-8); } });
}

function fmtDate(s){ return new Date(s).toLocaleDateString('uk-UA',{day:'numeric',month:'short'}); }
function esc(s){ return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''; }

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(document.activeElement?.id==='wInput') saveWeight();
    if(document.activeElement?.id==='hName') addHabit();
  }
});

load();
</script>
